<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Water Bottle Flip 3D Clash</title>
    <link rel="icon" type="image/png" href="TemplateData/game-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* ===== Ideofuzion template — responsive letterbox + loading UI =====
         All overrides live inline here because Unity regenerates TemplateData/style.css
         on every build; !important beats it. Water Bottle Flip 3D Clash is a portrait (9:16) game. */

      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0e0e12;
        touch-action: none;                 /* don't let the browser eat drags/clicks */
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }

      /* Full-viewport shell. Solid dark = clean loading backdrop + clean letterbox bars. */
      #unity-container {
        position: fixed; inset: 0;
        background: #0e0e12;
      }

      /* Canvas is positioned by JS (letterbox). Transparent so the backdrop shows through
         while loading; Unity fills it once the game renders. */
      #unity-canvas {
        display: block; position: absolute;
        background: transparent !important;
      }

      /* ---- Loading bar ---- */
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: none; z-index: 10; text-align: center;
      }
      #unity-logo {
        width: 180px; height: 180px; margin: 0 auto 12px;
        background: url('TemplateData/game-icon.png') center / contain no-repeat;
      }
      /* Shown only while we decide WHICH icon to display, so the player never sees the built-in
         icon flash and then get replaced by the admin one. Positioned ABSOLUTELY, over the logo
         box: in normal flow, removing it would reflow the column and make the icon jump. */
      #unity-logo-spinner {
        position: absolute; left: 50%; top: 90px;
        width: 34px; height: 34px; margin: -17px 0 0 -17px;
        border: 4px solid rgba(255,255,255,0.18);
        border-top-color: rgba(255,255,255,0.85);
        border-radius: 50%;
        animation: gb-spin 0.9s linear infinite;
      }
      @keyframes gb-spin { to { transform: rotate(360deg); } }
      #unity-progress-bar-empty {                 /* track */
        width: 300px; height: 18px; margin: 12px auto 0;
        background: #d9d9d9 !important; background-image: none !important;
        border-radius: 9px; overflow: hidden;
      }
      #unity-progress-bar-full {                  /* fill */
        width: 0%; height: 100%;
        background: #1C3A5B !important; background-image: none !important;
        margin-top: 0 !important;                 /* fix: default style.css pushes it down */
        border-radius: 9px; transition: width 0.1s ease;
      }
      #unity-progress-percent {                   /* % readout */
        color: #F2F2F2; font: 14px arial, sans-serif; margin-top: 6px;
      }

      /* No footer in this build. */
      #unity-footer { display: none !important; }
      #unity-warning {
        position: absolute; left: 50%; top: 5%; transform: translate(-50%);
        background: white; padding: 10px; display: none; z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-logo-spinner"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="unity-progress-percent">0%</div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // ===== Admin loading icon (customization.gameLogoUrl) =====
      // The loading screen renders BEFORE the engine starts, so C# cannot touch it — this has to
      // live here. Set per game from the GameBull ADMIN panel; no rebuild or redeploy needed,
      // because the icon is looked up on every page load.
      //
      // Reads PER-GAME fields only: gameLogoUrl, then gameBannerUrl. It deliberately ignores
      // logoUrl, tenantLogoUrl and assets[] — those are TENANT-WIDE, and on a shared tenant they
      // return whichever image some other game uploaded, so using them would show the wrong
      // game's logo here.
      (function applyAdminLoadingIcon() {
        var REVEAL_DEADLINE_MS = 4000;
        var revealed = false;

        function killSpinner() {
          var sp = document.querySelector("#unity-logo-spinner");
          if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
        }

        // Exactly ONE icon is ever shown — never the built-in one followed by the admin one.
        function reveal(iconUrl) {
          if (revealed) return;
          revealed = true;
          var el = document.querySelector("#unity-logo");
          if (el) {
            if (iconUrl) el.style.backgroundImage = 'url("' + iconUrl.replace(/"/g, "%22") + '")';
            el.style.visibility = "visible";
          }
          killSpinner();
        }

        try {
          // Hidden from JS, NOT from CSS: if this script never runs at all, the built-in icon
          // must still appear.
          var logo = document.querySelector("#unity-logo");
          if (logo) logo.style.visibility = "hidden";

          // Hard deadline — the icon is revealed even if the API never answers.
          setTimeout(function () { reveal(null); }, REVEAL_DEADLINE_MS);

          var q          = new URLSearchParams(window.location.search);
          var tenantSlug = q.get("tenantSlug");
          var token      = q.get("sessionToken") || q.get("bootToken") || q.get("token");
          var gameId     = q.get("gameId");

          // Default must match the environment this build was made for. Kept in sync with the C#
          // GAMEBULL_PRODUCTION define by Tools > GameBull > Environment.
          var apiBase    = q.get("apiBase") || "https://api.staging.g-b.store"; /* GAMEBULL_API_BASE */

          // gameId is read from the URL and NEVER hardcoded: a wrong id is still a VALID id for a
          // different game, so a hardcoded fallback would silently show another game's logo.
          // Missing anything -> skip the request entirely. No error, no delay.
          if (!tenantSlug || !token || !gameId) { reveal(null); return; }

          var ctl = new AbortController();
          setTimeout(function () { ctl.abort(); }, REVEAL_DEADLINE_MS);

          fetch(apiBase.replace(/\/+$/, "") + "/play/games/" + encodeURIComponent(gameId)
                  + "/context?tenantSlug=" + encodeURIComponent(tenantSlug),
                { headers: { "Authorization": "Bearer " + token }, signal: ctl.signal })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              var c = (data && data.customization) || {};
              var iconUrl = (typeof c.gameLogoUrl   === "string" && c.gameLogoUrl)   ? c.gameLogoUrl   :
                            (typeof c.gameBannerUrl === "string" && c.gameBannerUrl) ? c.gameBannerUrl : null;
              if (!iconUrl) { reveal(null); return; }

              // Preload and reveal only once decoded, so a slow or broken image never flashes
              // or appears half-drawn.
              var img = new Image();
              img.onload  = function () { reveal(iconUrl); };
              img.onerror = function () { reveal(null); };
              img.src = iconUrl;
            })
            .catch(function () { reveal(null); });
        } catch (e) { reveal(null); }
      })();
    </script>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // ===== Responsive letterbox: largest rect of the game's aspect that fits, centered =====
      // Aspect comes from the player's web canvas size (Player Settings -> 1080 x 1920 = 9:16).
      var GAME_ASPECT = 1080 / 1920;
      function resizeCanvas() {
        var availW = window.innerWidth, availH = window.innerHeight, w, h;
        if (availW / availH > GAME_ASPECT) { h = availH; w = Math.round(h * GAME_ASPECT); }
        else                               { w = availW; h = Math.round(w / GAME_ASPECT); }
        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
        canvas.style.left   = Math.round((availW - w) / 2) + "px";
        canvas.style.top    = Math.round((availH - h) / 2) + "px";
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // ===== Single source of truth for the loading bar + percent =====
      function setLoadProgress(p) {
        var pct  = Math.round(p * 100);
        var full = document.querySelector("#unity-progress-bar-full");
        var txt  = document.querySelector("#unity-progress-percent");
        if (full) full.style.width = pct + "%";
        if (txt)  txt.innerText    = pct + "%";
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl-staging.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl-staging.data",
        frameworkUrl: buildUrl + "/webgl-staging.framework.js",
        codeUrl: buildUrl + "/webgl-staging.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "YES GAME STUDIO",
        productName: "Water Bottle Flip 3D Clash",
        productVersion: "2.5",
        showBanner: unityShowBanner,
        // Render buffer tracks the CSS (letterboxed) canvas size -> responsive, no distortion.
        matchWebGLToCanvasSize: true,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, setLoadProgress).then((unityInstance) => {
          window.unityInstance = unityInstance;

          // Force 100% before hiding (Unity's onProgress plateaus at 0.9).
          setLoadProgress(1);

          // Safari/WebKit keeps painting loading elements even after display:none on a parent.
          // Hide each explicitly, clear its background image, then REMOVE it from the DOM.
          function killEl(sel) {
            var el = document.querySelector(sel);
            if (!el) return;
            el.style.display = "none";
            el.style.visibility = "hidden";
            el.style.opacity = "0";
            el.style.backgroundImage = "none";
            if (el.parentNode) el.parentNode.removeChild(el);
          }
          killEl("#unity-logo");
          killEl("#unity-logo-spinner");   // or it lingers, spinning, over the running game
          killEl("#unity-progress-bar-full");
          killEl("#unity-progress-bar-empty");
          killEl("#unity-progress-percent");
          killEl("#unity-loading-bar");

          resizeCanvas();

          // ===== Page <-> game bridge (GameBull) =====
          // Water Bottle Flip 3D Clash reads its boot params straight from the URL query string in
          // GameBullBoot, so we only announce readiness here. If a SendMessage-style
          // handshake is ever needed, forward the payload via
          // unityInstance.SendMessage('<BridgeObject>', '<Method>', payload).
          try { window.parent.postMessage({ type: 'game:ready' }, '*'); } catch (e) {}
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
